apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-secondary
  namespace: vllm
  labels:
    app: vllm
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: secondary
spec:
  replicas: 1

  selector:
    matchLabels:
      app: vllm
      app.kubernetes.io/instance: secondary

  template:
    metadata:
      labels:
        app: vllm
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: secondary

    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false

      nodeSelector:
        kubernetes.io/hostname: ip-172-31-6-36

      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent

          args:
            - --model
            - microsoft/Phi-3-mini-4k-instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "4096"

          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "1"
              memory: 6Gi
              nvidia.com/gpu: 1
            limits:
              memory: 12Gi
              nvidia.com/gpu: 1

          volumeMounts:
            - name: hf-cache-secondary
              mountPath: /root/.cache/huggingface

      volumes:
        - name: hf-cache-secondary
          persistentVolumeClaim:
            claimName: hf-cache-secondary
