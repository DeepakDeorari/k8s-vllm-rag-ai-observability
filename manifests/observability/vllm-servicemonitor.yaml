apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - vllm

  selector:
    matchLabels:
      app: vllm

  endpoints:
    - port: http
      path: /metrics
      interval: 15s

