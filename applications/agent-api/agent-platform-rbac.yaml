apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sre-agent
  namespace: agent-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-sre-agent-readonly
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/status
      - events
      - nodes
      - services
      - endpoints
      - namespaces
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - "apps"
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-sre-agent-readonly
subjects:
  - kind: ServiceAccount
    name: ai-sre-agent
    namespace: agent-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-sre-agent-readonly
