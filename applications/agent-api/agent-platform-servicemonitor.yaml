apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-sre-agent
  namespace: observability
  labels:
    release: kube-prometheus-stack

spec:
  namespaceSelector:
    matchNames:
      - agent-platform

  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sre-agent

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
