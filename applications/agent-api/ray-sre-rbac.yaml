apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sre-ray
  namespace: ray-cluster
  labels:
    app.kubernetes.io/name: ai-sre-ray
    app.kubernetes.io/part-of: ai-sre-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-sre-ray-readonly
subjects:
  - kind: ServiceAccount
    name: ai-sre-ray
    namespace: ray-cluster

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-sre-agent-readonly
